# .github/workflows/release.yml
name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip dist folder
        run: |
          cd API_diag/bin/Release
          zip -r "$GITHUB_WORKSPACE/winmostore-${{ github.ref_name }}.zip" .

      - name: Copy CAB file
        run: |
          cp "WinMoStore deploy/Release/WinMoStore deploy.CAB" \
             "$GITHUB_WORKSPACE/WinMoStore-deploy-${{ github.ref_name }}.cab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            winmostore-${{ github.ref_name }}.zip
            WinMoStore-deploy-${{ github.ref_name }}.cab